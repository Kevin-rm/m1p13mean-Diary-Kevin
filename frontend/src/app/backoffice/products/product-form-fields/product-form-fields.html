<div [formGroup]="form()" class="flex flex-col gap-5">
  <app-form-field
    [inputId]="idPrefix() + 'Name'"
    label="Nom"
    [control]="form().controls['name']"
    [errors]="{ required: 'Le nom est requis' }"
  >
    <input pInputText [id]="idPrefix() + 'Name'" formControlName="name" />
  </app-form-field>

  <app-form-field
    [inputId]="idPrefix() + 'Description'"
    label="Description"
    [control]="form().controls['description']"
  >
    <textarea
      pTextarea
      [id]="idPrefix() + 'Description'"
      formControlName="description"
      rows="3"
    ></textarea>
  </app-form-field>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
    <app-form-field
      [inputId]="idPrefix() + 'Price'"
      label="Prix"
      [control]="form().controls['price']"
      [errors]="{ required: 'Le prix est requis', min: 'Le prix doit être positif' }"
    >
      <p-inputnumber
        [id]="idPrefix() + 'Price'"
        formControlName="price"
        mode="currency"
        currency="MGA"
        locale="fr-FR"
        [minFractionDigits]="0"
        [maxFractionDigits]="0"
      />
    </app-form-field>

    <app-form-field
      [inputId]="idPrefix() + 'Stock'"
      label="Stock"
      [control]="form().controls['stock']"
      [errors]="{ min: 'Le stock doit être positif' }"
    >
      <p-inputnumber
        [id]="idPrefix() + 'Stock'"
        formControlName="stock"
        [min]="0"
        [showButtons]="true"
      />
    </app-form-field>
  </div>

  <app-form-field
    [inputId]="idPrefix() + 'Category'"
    label="Catégorie"
    [control]="form().controls['category']"
    [errors]="{ required: 'La catégorie est requise' }"
  >
    <p-select
      [inputId]="idPrefix() + 'Category'"
      [options]="categories()"
      formControlName="category"
      optionLabel="name"
      optionValue="id"
      placeholder="Sélectionner une catégorie"
    />
  </app-form-field>
</div>
