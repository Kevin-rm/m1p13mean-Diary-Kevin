<div
  class="flex flex-col h-full bg-surface-0 transition-all duration-200"
  [ngClass]="collapsed() ? 'w-16' : 'w-64'"
>
  <div class="flex items-center gap-2 h-14 px-4 py-2 border-b border-surface">
    @if (!collapsed()) {
      <a [routerLink]="nav.homeLink()" class="no-underline text-color font-medium text-xl"
        >MallHub</a
      >
    } @else {
      <a [routerLink]="nav.homeLink()" class="no-underline text-color font-medium text-xl mx-auto"
        >M</a
      >
    }
  </div>

  <app-sidebar-nav [collapsed]="collapsed()" class="p-2" />
</div>
