<mat-toolbar color="primary">
  <a routerLink="/" class="no-underline text-inherit font-medium text-xl">MallHub</a>

  <span class="flex-1"></span>

  @if (authService.isAuthenticated()) {
    <span class="mr-4">{{ authService.user()?.firstName }}</span>
  } @else {
    <a mat-button routerLink="/login">Se connecter</a>
    <a mat-flat-button routerLink="/register" class="ml-2">S'inscrire</a>
  }
</mat-toolbar>
