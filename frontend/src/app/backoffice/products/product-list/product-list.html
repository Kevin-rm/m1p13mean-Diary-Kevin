<div class="flex items-center justify-between mb-4">
  <h1 class="text-2xl font-semibold m-0">Produits</h1>
  <p-button label="Nouveau produit" icon="pi pi-plus" (click)="navigateToNew()" />
</div>

<div class="flex flex-col sm:flex-row gap-3 mb-4">
  <p-iconfield>
    <p-inputicon class="pi pi-search" />
    <input
      pInputText
      id="productSearch"
      placeholder="Rechercher un produit..."
      [(ngModel)]="searchValue"
      (input)="onSearch()"
    />
  </p-iconfield>

  <p-select
    inputId="productCategoryFilter"
    [options]="categories"
    [(ngModel)]="categoryFilter"
    (onChange)="onFilter()"
    optionLabel="label"
    optionValue="value"
    placeholder="Catégorie"
    class="w-full sm:w-48"
  />

  <p-select
    inputId="productStatusFilter"
    [options]="statusOptions"
    [(ngModel)]="statusFilter"
    (onChange)="onFilter()"
    optionLabel="label"
    optionValue="value"
    placeholder="Statut"
    class="w-full sm:w-40"
  />
</div>

<ng-template #headerTpl>
  <tr>
    <th pResizableColumn class="w-16">Image</th>
    <th pResizableColumn>Nom</th>
    <th pResizableColumn>Catégorie</th>
    <th pResizableColumn>Prix</th>
    <th pResizableColumn>Stock</th>
    <th pResizableColumn>Statut</th>
    <th class="w-28">Actions</th>
  </tr>
</ng-template>

<ng-template #bodyTpl let-product>
  <tr>
    <td>
      @if (product.images?.length) {
        <img
          [src]="product.images[0]"
          [alt]="product.name"
          class="w-10 h-10 rounded object-cover"
        />
      } @else {
        <div class="w-10 h-10 rounded bg-surface-200 flex items-center justify-center">
          <i class="pi pi-image text-muted-color"></i>
        </div>
      }
    </td>
    <td class="font-medium">{{ product.name }}</td>
    <td class="text-muted-color">{{ product.category?.name || "—" }}</td>
    <td>{{ product.price | currency: "MGA" : "symbol" : "1.0-0" }}</td>
    <td>{{ product.stock }}</td>
    <td>
      <p-tag
        [value]="product.isActive ? 'Actif' : 'Inactif'"
        [severity]="product.isActive ? 'success' : 'danger'"
      />
    </td>
    <td>
      <div class="flex justify-end gap-1">
        <p-button
          icon="pi pi-eye"
          [text]="true"
          [rounded]="true"
          severity="info"
          (click)="navigateToProduct(product)"
          pTooltip="Voir"
        />
        <p-button
          [icon]="product.isActive ? 'pi pi-eye-slash' : 'pi pi-check-circle'"
          [text]="true"
          [rounded]="true"
          [severity]="product.isActive ? 'warn' : 'success'"
          (click)="toggleActive(product)"
          [pTooltip]="product.isActive ? 'Désactiver' : 'Activer'"
        />
      </div>
    </td>
  </tr>
</ng-template>

<app-data-table
  [state]="table"
  [headerTpl]="headerTpl"
  [bodyTpl]="bodyTpl"
  [columns]="7"
  emptyMessage="Aucun produit trouvé"
  [tableStyle]="{ 'min-width': '50rem' }"
  (lazyLoad)="loadProducts($event)"
/>
