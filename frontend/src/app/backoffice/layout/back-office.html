<div class="flex h-screen overflow-hidden">
  <div class="hidden lg:flex border-r border-surface">
    <app-sidebar [collapsed]="sidebarCollapsed()" />
  </div>

  <p-drawer [(visible)]="mobileSidebarVisible" [modal]="true" position="left" styleClass="w-72">
    <ng-template #header>
      <a routerLink="/" class="no-underline text-color font-medium text-xl">MallHub</a>
    </ng-template>
    <app-sidebar-nav />
  </p-drawer>

  <div class="flex flex-col flex-1 min-w-0">
    <app-bo-header (menuToggle)="mobileSidebarVisible.set(true)" class="lg:hidden" />
    <app-bo-header (menuToggle)="toggleSidebar()" class="hidden lg:block" />
    <main class="flex-1 overflow-y-auto p-4 lg:p-6">
      <router-outlet />
    </main>
    <app-footer />
  </div>
</div>
