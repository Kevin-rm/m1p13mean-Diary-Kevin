<h1 class="text-2xl font-semibold mb-4">Boutiques</h1>

<div class="flex flex-col sm:flex-row gap-3 mb-4">
  <p-iconfield>
    <p-inputicon class="pi pi-search" />
    <input
      pInputText
      placeholder="Rechercher une boutique..."
      [(ngModel)]="searchValue"
      (input)="onSearch()"
    />
  </p-iconfield>

  <p-select
    [options]="statusOptions"
    [(ngModel)]="statusFilter"
    (onChange)="onStatusFilter()"
    optionLabel="label"
    optionValue="value"
    placeholder="Filtrer par statut"
    class="w-full sm:w-48"
  />
</div>

<p-table
  [value]="shops()"
  [lazy]="true"
  [paginator]="true"
  [rows]="10"
  [totalRecords]="totalRecords()"
  [loading]="loading()"
  (onLazyLoad)="loadShops($event)"
  [rowsPerPageOptions]="[10, 25, 50]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="{first} - {last} sur {totalRecords}"
  [tableStyle]="{ 'min-width': '50rem' }"
>
  <ng-template #header>
    <tr>
      <th>Nom</th>
      <th>Propriétaire</th>
      <th>Email contact</th>
      <th>Statut</th>
      <th class="w-28">Actions</th>
    </tr>
  </ng-template>

  <ng-template #body let-shop>
    <tr>
      <td class="font-medium">{{ shop.name }}</td>
      <td class="text-muted-color">{{ ownerName(shop) }}</td>
      <td class="text-muted-color">{{ shop.contactEmail || "—" }}</td>
      <td>
        <p-tag [value]="statusLabel(shop.status)" [severity]="statusSeverity(shop.status)" />
      </td>
      <td>
        <div class="flex gap-1">
          @if (shop.status === "pending") {
            <p-button
              icon="pi pi-check"
              [text]="true"
              [rounded]="true"
              severity="success"
              (click)="validateShop(shop)"
              pTooltip="Valider"
            />
          }
          @if (shop.status === "active") {
            <p-button
              icon="pi pi-ban"
              [text]="true"
              [rounded]="true"
              severity="danger"
              (click)="suspendShop(shop)"
              pTooltip="Suspendre"
            />
          }
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="5" class="text-center text-muted-color py-8">Aucune boutique trouvée</td>
    </tr>
  </ng-template>
</p-table>
