<p-menubar
  [model]="menuItems"
  [dt]="{
    root: { borderRadius: '0', padding: '0.75rem 1rem', height: '3.5rem' },
    item: { focusBackground: 'transparent' },
  }"
>
  <ng-template #start>
    <a routerLink="/" class="no-underline text-inherit font-medium text-xl">MallHub</a>
  </ng-template>

  <ng-template #end>
    @if (authService.isAuthenticated()) {
      <app-user-menu [extraItems]="userMenuItems" />
    } @else {
      <p-button
        label="Se connecter"
        [text]="true"
        routerLink="/login"
        class="hidden sm:inline-flex"
      />
      <p-button
        icon="pi pi-sign-in"
        [text]="true"
        [rounded]="true"
        routerLink="/login"
        class="sm:hidden"
      />
      <p-button
        icon="pi pi-user-plus"
        [text]="true"
        [rounded]="true"
        routerLink="/register"
        class="sm:hidden"
      />
      <p-button label="S'inscrire" routerLink="/register" class="hidden ml-2 sm:inline-flex" />
    }
  </ng-template>
</p-menubar>
