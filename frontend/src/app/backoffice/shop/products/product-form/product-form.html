<app-page-header title="Nouveau produit" [back]="true" />

<div class="max-w-2xl">
  <p-fluid>
    <form id="productForm" [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
      <app-product-form-fields [form]="form" [categories]="categories" />

      <div>
        <label class="block font-medium mb-2">Images (max 5)</label>
        <input
          type="file"
          accept="image/jpeg,image/png,image/webp"
          multiple
          (change)="onFilesSelected($event)"
          class="block w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-medium file:bg-primary file:text-primary-contrast hover:file:cursor-pointer"
          [disabled]="selectedFiles.length >= 5"
        />
        @if (previews.length) {
          <div class="flex flex-wrap gap-3 mt-3">
            @for (preview of previews; track preview; let i = $index) {
              <div class="relative">
                <img
                  [src]="preview"
                  alt="Prévisualisation"
                  class="w-24 h-24 rounded object-cover border border-surface-200"
                />
                <p-button
                  icon="pi pi-times"
                  [rounded]="true"
                  severity="danger"
                  size="small"
                  (click)="removeFile(i)"
                  class="!absolute -top-2 -right-2"
                  styleClass="!w-6 !h-6"
                />
              </div>
            }
          </div>
        }
      </div>

      <div class="flex justify-end gap-3 mt-2">
        <p-button
          label="Annuler"
          icon="pi pi-times"
          severity="secondary"
          [outlined]="true"
          routerLink="/backoffice/shop/products"
        />
        <p-button
          [label]="saving() ? 'Enregistrement...' : 'Créer le produit'"
          icon="pi pi-check"
          type="submit"
          [disabled]="form.invalid || saving()"
          [loading]="saving()"
        />
      </div>
    </form>
  </p-fluid>
</div>
