<p-confirmDialog />

<app-record-page
  [title]="shop()?.name ?? 'Ma boutique'"
  [loading]="loading()"
  [showImage]="true"
  [image]="shop()?.logoUrl ?? ''"
>
  <label
    image-action
    class="absolute inset-0 flex items-center justify-center bg-black/40 text-white rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer"
  >
    <i class="pi pi-camera text-2xl"></i>
    <input type="file" accept="image/*" class="hidden" (change)="uploadLogo($event)" />
  </label>
  <div actions class="flex gap-2">
    @if (shop()) {
      @if (editing()) {
        <p-button
          label="Annuler"
          severity="secondary"
          [outlined]="true"
          (click)="cancelEditing()"
        />
        <p-button
          [label]="saving() ? 'Enregistrement...' : 'Enregistrer'"
          form="editShopForm"
          type="submit"
          [disabled]="form.invalid || saving()"
          [loading]="saving()"
        />
      } @else {
        <p-button
          label="Modifier"
          icon="pi pi-pencil"
          severity="info"
          [outlined]="true"
          (click)="startEditing()"
        />
      }
    }
  </div>

  @if (shop(); as s) {
    @if (editing()) {
      <form id="editShopForm" [formGroup]="form" (ngSubmit)="saveShop()">
        <app-shop-form-fields [form]="form" idPrefix="edit" />
      </form>
    } @else {
      <app-shop-form-fields [form]="form" [readonly]="true" />
    }
  }

  <ng-template recordTab="Horaires">
    @if (shop(); as s) {
      <app-schedule-editor [schedule]="s.schedule" (save)="saveSchedule($event)" />
    }
  </ng-template>

  <ng-template recordTab="Images">
    @if (shop(); as s) {
      @if (s.images.length) {
        <div class="flex flex-wrap gap-4">
          @for (image of s.images; track image) {
            <p-image
              [src]="image"
              [alt]="s.name"
              width="128"
              [preview]="true"
              imageClass="rounded-lg object-cover border border-surface-200"
              [imageStyle]="{ width: '128px', height: '128px' }"
            />
          }
        </div>
      } @else {
        <p class="text-muted-color">Aucune image</p>
      }

      <div class="mt-6">
        <app-image-upload
          #imageUpload
          [multiple]="false"
          [showUploadButton]="true"
          (upload)="uploadImages($event)"
        />
      </div>
    }
  </ng-template>
</app-record-page>
