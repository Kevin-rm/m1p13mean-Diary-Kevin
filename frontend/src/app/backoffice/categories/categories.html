<div class="flex items-center justify-between mb-4">
  <h1 class="text-2xl font-semibold m-0">Catégories</h1>
  <p-button label="Nouvelle catégorie" icon="pi pi-plus" (click)="openCreateDialog()" />
</div>

<div class="mb-4">
  <p-iconfield>
    <p-inputicon class="pi pi-search" />
    <input
      pInputText
      placeholder="Rechercher une catégorie..."
      [(ngModel)]="searchValue"
      (input)="onSearch()"
    />
  </p-iconfield>
</div>

<p-table
  [value]="categories()"
  [lazy]="true"
  [paginator]="true"
  [rows]="10"
  [totalRecords]="totalRecords()"
  [loading]="loading()"
  (onLazyLoad)="loadCategories($event)"
  [rowsPerPageOptions]="[10, 25, 50]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="{first} - {last} sur {totalRecords}"
>
  <ng-template #header>
    <tr>
      <th>Nom</th>
      <th>Description</th>
      <th>Statut</th>
      <th class="w-28">Actions</th>
    </tr>
  </ng-template>

  <ng-template #body let-category>
    <tr>
      <td class="font-medium">{{ category.name }}</td>
      <td class="text-muted-color">{{ category.description || "—" }}</td>
      <td>
        <p-tag
          [value]="category.isActive ? 'Actif' : 'Inactif'"
          [severity]="category.isActive ? 'success' : 'danger'"
        />
      </td>
      <td>
        <div class="flex gap-1">
          <p-button
            icon="pi pi-pencil"
            [text]="true"
            [rounded]="true"
            severity="info"
            (click)="openEditDialog(category)"
            pTooltip="Modifier"
          />
          <p-button
            [icon]="category.isActive ? 'pi pi-eye-slash' : 'pi pi-eye'"
            [text]="true"
            [rounded]="true"
            [severity]="category.isActive ? 'warn' : 'success'"
            (click)="toggleActive(category)"
            [pTooltip]="category.isActive ? 'Désactiver' : 'Activer'"
          />
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="4" class="text-center text-muted-color py-8">Aucune catégorie trouvée</td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [header]="editing() ? 'Modifier la catégorie' : 'Nouvelle catégorie'"
  [(visible)]="dialogVisible"
  [modal]="true"
  [style]="{ width: '28rem' }"
>
  <p-fluid>
    <form [formGroup]="form" (ngSubmit)="saveCategory()" class="flex flex-col gap-4">
      <app-form-field
        inputId="categoryName"
        label="Nom"
        [control]="form.controls.name"
        [errors]="{ required: 'Le nom est requis' }"
      >
        <input pInputText id="categoryName" formControlName="name" />
      </app-form-field>

      <app-form-field
        inputId="categoryDescription"
        label="Description"
        [control]="form.controls.description"
      >
        <textarea
          pTextarea
          id="categoryDescription"
          formControlName="description"
          rows="3"
        ></textarea>
      </app-form-field>

      <div class="flex justify-end gap-2 pt-2">
        <p-button
          label="Annuler"
          severity="secondary"
          [text]="true"
          (click)="dialogVisible.set(false)"
        />
        <p-button
          [label]="saving() ? 'Enregistrement...' : 'Enregistrer'"
          type="submit"
          [disabled]="form.invalid || saving()"
          [loading]="saving()"
        />
      </div>
    </form>
  </p-fluid>
</p-dialog>
