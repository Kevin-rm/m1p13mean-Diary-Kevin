<app-user-avatar
  [user]="authService.user()!"
  class="cursor-pointer"
  (click)="toggleUserMenu($event)"
/>
<p-menu #userMenu [model]="menuItems()" [popup]="true" [style]="{ 'min-width': '16rem' }">
  <ng-template #start>
    <div class="flex items-center gap-3 px-2 py-3">
      <app-user-avatar [user]="authService.user()!" size="large" />
      <div class="flex flex-col overflow-hidden">
        <span class="font-medium truncate">{{ authService.fullName() }}</span>
        <span class="text-sm text-muted-color truncate">{{ authService.user()?.email }}</span>
      </div>
    </div>
  </ng-template>
</p-menu>
