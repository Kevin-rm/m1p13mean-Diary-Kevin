<ng-template #formActions>
  <p-button label="Réinitialiser" severity="secondary" [outlined]="true" (click)="resetForm()" />
  <p-button
    [label]="saving() ? 'Enregistrement...' : 'Créer le produit'"
    form="productForm"
    type="submit"
    [disabled]="form.invalid || saving()"
    [loading]="saving()"
  />
</ng-template>

<app-page-header title="Nouveau produit" [back]="true">
  <div class="flex gap-2">
    <ng-container *ngTemplateOutlet="formActions" />
  </div>
</app-page-header>

<p-card header="Informations du produit" subheader="Renseignez les détails du produit">
  <form id="productForm" [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
    <app-product-form-fields [form]="form" [categories]="categories" />

    <p-fileupload
      #fileUpload
      mode="advanced"
      [customUpload]="true"
      [multiple]="true"
      accept="image/jpeg,image/png,image/webp"
      [maxFileSize]="5000000"
      [fileLimit]="5"
      [previewWidth]="80"
      [showUploadButton]="false"
      [showCancelButton]="false"
      chooseLabel="Sélectionner des images"
      chooseIcon="none"
    >
      <ng-template #empty>
        <p class="text-muted-color m-0">
          Glissez-déposez des images ici ou cliquez pour sélectionner (max 5)
        </p>
      </ng-template>
    </p-fileupload>
  </form>
</p-card>

<div class="flex justify-end gap-3 mt-4">
  <ng-container *ngTemplateOutlet="formActions" />
</div>
