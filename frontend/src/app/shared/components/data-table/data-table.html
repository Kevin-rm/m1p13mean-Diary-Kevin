<p-table
  [value]="state().items()"
  [lazy]="true"
  [paginator]="true"
  [rows]="state().rows()"
  [first]="state().first()"
  [totalRecords]="state().totalRecords()"
  [loading]="state().loading()"
  (onLazyLoad)="lazyLoad.emit($event)"
  [rowsPerPageOptions]="[10, 25, 50]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="{first} - {last} sur {totalRecords}"
  [resizableColumns]="true"
  [showGridlines]="true"
  [tableStyle]="tableStyle()"
>
  <ng-template #header>
    <ng-container [ngTemplateOutlet]="headerTpl()" [ngTemplateOutletInjector]="tableInjector" />
  </ng-template>

  <ng-template #body let-item>
    <ng-container [ngTemplateOutlet]="bodyTpl()" [ngTemplateOutletContext]="{ $implicit: item }" />
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td [attr.colspan]="columns()" class="text-center text-muted-color py-8">
        {{ emptyMessage() }}
      </td>
    </tr>
  </ng-template>
</p-table>
