<app-page-header title="Tableau de bord" />

@if (shopStats.isPending() || orderStats.isPending()) {
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    @for (_ of [1, 2, 3, 4]; track $index) {
      <p-skeleton height="6rem" />
    }
  </div>
} @else {
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="p-4 rounded-lg border border-surface flex items-center gap-4">
      <div class="flex items-center justify-center size-12 rounded-full bg-blue-50 text-blue-500">
        <i class="pi pi-shop text-xl"></i>
      </div>
      <div>
        <p class="text-sm text-muted-color">Boutiques</p>
        <p class="text-2xl font-bold">{{ shops().total }}</p>
      </div>
    </div>
    <div class="p-4 rounded-lg border border-surface flex items-center gap-4">
      <div class="flex items-center justify-center size-12 rounded-full bg-amber-50 text-amber-500">
        <i class="pi pi-clock text-xl"></i>
      </div>
      <div>
        <p class="text-sm text-muted-color">En attente</p>
        <p class="text-2xl font-bold">{{ shops().byStatus["pending"] || 0 }}</p>
      </div>
    </div>
    <div class="p-4 rounded-lg border border-surface flex items-center gap-4">
      <div class="flex items-center justify-center size-12 rounded-full bg-green-50 text-green-500">
        <i class="pi pi-shopping-cart text-xl"></i>
      </div>
      <div>
        <p class="text-sm text-muted-color">Commandes</p>
        <p class="text-2xl font-bold">{{ orders().total }}</p>
      </div>
    </div>
    <div class="p-4 rounded-lg border border-surface flex items-center gap-4">
      <div
        class="flex items-center justify-center size-12 rounded-full bg-emerald-50 text-emerald-500"
      >
        <i class="pi pi-wallet text-xl"></i>
      </div>
      <div>
        <p class="text-sm text-muted-color">Chiffre d'affaires</p>
        <p class="text-2xl font-bold">{{ orders().revenue | ariary }}</p>
      </div>
    </div>
  </div>
}
