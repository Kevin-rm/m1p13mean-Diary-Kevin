<header
  class="flex items-center justify-between h-14 px-4 py-2 border-b border-surface bg-surface-0"
>
  <div class="flex items-center gap-1">
    <p-button icon="pi pi-bars" [text]="true" [rounded]="true" (click)="menuToggle.emit()" />
    <p-breadcrumb [model]="breadcrumb.items()" [home]="home" />
  </div>
  <app-user-menu [extraItems]="userMenuItems" />
</header>
